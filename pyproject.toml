[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w4-crack-pipeline"
version = "2.0.0"
description = "WPA/WPA2/PMKID password-audit cracking pipeline (own-lab captured traffic only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com" },
]
keywords = ["wpa", "wpa2", "wifi", "audit", "hashcat", "pmkid", "cracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.4"]

[project.scripts]
crack = "firmware.crack_pipeline:main"

[tool.setuptools.packages.find]
include = ["firmware*"]